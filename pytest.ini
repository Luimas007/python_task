[pytest]
testpaths = tests
addopts = -q --tb=short --color=no
markers =
    parsing: scraper parsing and normalisation
    database: PostgreSQL schema, integrity and retrieval
    agents: multi-agent behaviour
    api: HTTP and WebSocket surface
    app: app.py entry point and bring-up
    llm: needs a running Ollama with the configured model
filterwarnings =
    ignore::DeprecationWarning
